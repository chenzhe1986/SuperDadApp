<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>化学视界 · 3D 元素与物质演示</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 3h6" />
        <path d="M10 3v5.5L4.5 17.5A2.5 2.5 0 0 0 6.7 21h10.6a2.5 2.5 0 0 0 2.2-3.5L14 8.5V3" />
        <path d="M7.5 14h9" />
      </svg>
      <h1>化学视界</h1>
      <span class="subtitle">3D 元素与物质演示</span>
    </div>
    <div class="top-actions">
      <!-- 顶栏「← 返回」：浏览过元素/物质后出现（main.js 按历史栈显隐），
           与系统返回键同一语义，一层层回退 -->
      <button id="navBackBtn" class="btn nav-back" hidden aria-label="返回上一层" title="返回上一层">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M15 18l-6-6 6-6" />
        </svg>返回
      </button>
      <div class="custom-input">
        <input id="zInput" type="text" inputmode="numeric" placeholder="输入原子序数" maxlength="100" />
        <button id="zGo" class="btn">显示</button>
        <span id="inputHint" class="input-hint"></span>
      </div>
      <button id="periodicBtn" class="btn primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <rect x="3" y="3" width="5" height="5" rx="1" /><rect x="10" y="3" width="5" height="5" rx="1" />
          <rect x="17" y="3" width="4" height="5" rx="1" /><rect x="3" y="10" width="5" height="5" rx="1" />
          <rect x="10" y="10" width="5" height="5" rx="1" /><rect x="17" y="10" width="4" height="5" rx="1" />
          <rect x="3" y="17" width="5" height="4" rx="1" /><rect x="10" y="17" width="5" height="4" rx="1" />
        </svg>元素周期表
      </button>
      <!-- 声音总开关：一键静音/恢复交互音效与介绍朗读（状态存 localStorage） -->
      <button id="soundToggle" class="btn sound-toggle" title="声音 开/关" aria-pressed="true">
        <svg class="icon-sound" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <path d="M11 5 6 9H3v6h3l5 4z" />
          <path d="M15.5 8.5a5 5 0 0 1 0 7" />
          <path d="M18.5 5.5a9 9 0 0 1 0 13" />
        </svg>
        <svg class="icon-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M11 5 6 9H3v6h3l5 4z" />
          <line x1="22" y1="9" x2="16" y2="15" /><line x1="16" y1="9" x2="22" y2="15" />
        </svg>
        <span>声音</span>
      </button>
    </div>
  </header>

  <main class="stage">
    <canvas id="scene"></canvas>
    <div class="stage-controls">
      <button id="autoRotate" class="ctrl-btn active" title="自动旋转 开/关">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-2.6-6.4" /><path d="M21 3v6h-6" />
        </svg><span>旋转</span>
      </button>
      <button id="resetView" class="ctrl-btn" title="重置视角">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <circle cx="12" cy="12" r="3.2" /><path d="M12 2v3M12 19v3M2 12h3M19 12h3" />
        </svg><span>复位</span>
      </button>
    </div>
    <div class="hint">拖拽旋转 · 双指缩放 · 右键平移</div>
    <div id="infoPanel" class="info-panel">
      <!-- 重读按钮：点击重新朗读当前介绍（自动朗读被打断或想再听一遍时用） -->
      <button id="readSpeakBtn" class="info-read" type="button" title="重新朗读介绍" aria-label="重新朗读介绍">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M11 5 6 9H3v6h3l5 4z" />
          <path d="M15.5 8.5a5 5 0 0 1 0 7" />
          <path d="M18.5 5.5a9 9 0 0 1 0 13" />
        </svg>
      </button>
      <div class="info-title" id="infoTitle"></div>
      <div class="info-sub" id="infoSub"></div>
      <div class="info-meta" id="infoMeta"></div>
      <div class="info-desc" id="infoDesc"></div>
      <div class="info-legend" id="infoLegend"></div>
      <div class="info-sub-label" id="infoSubLabel">相关物质（点击查看 3D 结构）</div>
      <div class="info-substances" id="infoSubstances"></div>
    </div>
  </main>

  <!-- 竖屏提醒（仅手机竖屏时显示；App 内因已锁定横屏不会出现） -->
  <div id="rotateTip" class="rotate-tip">
    <div class="rotate-card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="7" y="3" width="10" height="18" rx="2" />
        <path d="M3 8a9 9 0 0 1 3-4M21 16a9 9 0 0 1-3 4" />
        <path d="M3 12h4M17 12h4" />
      </svg>
      <h3>建议横屏观看</h3>
      <p>周期表和 3D 结构在横屏下体验更佳</p>
      <button id="rotateFull" class="btn primary">全屏并锁定横屏</button>
      <button id="rotateSkip" class="rotate-skip">仍要竖屏使用</button>
    </div>
  </div>

  <!-- 元素周期表弹窗 -->
  <div id="ptModal" class="pt-modal" aria-hidden="true">
    <div id="ptBackdrop" class="pt-backdrop"></div>
    <div class="pt-panel">
      <div class="pt-head">
        <!-- 无关闭按钮：按需求去掉了 ✕，退出途径 = 选元素/点遮罩/Esc/系统返回 -->
        <div class="pt-title">
          <h2>元素周期表</h2>
          <span>1 ~ 118 号 · 点击元素查看介绍与 3D 原子结构</span>
        </div>
      </div>
      <div class="pt-scroll">
        <div id="ptGrid" class="pt-grid"></div>
      </div>
      <div id="ptLegend" class="pt-legend"></div>
    </div>
  </div>

  <script src="js/lib/three.min.js"></script>
  <script src="js/lib/OrbitControls.js"></script>
  <script src="js/data.js"></script>
  <script src="js/substances.js"></script>
  <script src="js/models.js"></script>
  <script src="js/periodic.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
